<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PCP Forms — Builder</title><link rel="stylesheet" href="../css/common.css"><link rel="stylesheet" href="../css/builder.css"></head><body><div class="bg"></div><header class="topbar"><div class="bar"><a class="brand" href="./dashboard.html"><img src="../asset/logo/txt.png"><div class="copy"><b>PERSONA</b><b>COMMUNITY</b><b>PLAYER</b></div></a><div class="builder-actions"><span id="saveState" class="muted"><i class="save-dot"></i>Saved</span><button class="btn" id="preview">PREVIEW</button><button class="btn primary" id="publish">PUBLISH</button><button class="btn" id="back">BACK</button></div></div></header><main class="builder container"><section class="editor"><div class="card form-settings"><input id="title" class="title-input" placeholder="Form title"><textarea id="description" placeholder="Tell respondents what this form is about…"></textarea></div><div id="questions"></div><button class="add-question btn primary">+ ADD QUESTION</button></section><aside class="card settings"><h3>FORM SETTINGS</h3><label class="switch-row"><span>Collect email</span><input id="collectEmail" type="checkbox"></label><label class="switch-row"><span>Show progress</span><input id="showProgress" type="checkbox"></label><label class="switch-row"><span>Shuffle questions</span><input id="shuffle" type="checkbox"></label><div class="field"><label>Confirmation message</label><textarea id="confirmation"></textarea></div><div class="share-box"><small>PUBLIC FORM URL</small><input id="shareUrl" readonly><button class="btn" id="copyUrl">COPY LINK</button><button class="btn danger hidden" id="unpublish">UNPUBLISH</button></div></aside></main>
<script type="module">import{auth,db,onAuthStateChanged,doc,getDoc,updateDoc,serverTimestamp}from'../js/firebase.js';import{toast,esc}from'../js/ui.js';const id=new URLSearchParams(location.search).get('id');let formData={},questions=[],saveTimer;const qEl=document.querySelector('#questions');const types=[['short','Short answer'],['paragraph','Paragraph'],['email','Email'],['number','Number'],['date','Date'],['time','Time'],['single','Multiple choice'],['multi','Checkboxes'],['dropdown','Dropdown'],['scale','Linear scale']];if(!id)location.href='./dashboard.html';onAuthStateChanged(auth,async u=>{if(!u)location.href='./index.html';else load()});async function load(){const s=await getDoc(doc(db,'forms',id));if(!s.exists()){alert('Form not found');location.href='./dashboard.html';return}formData=s.data();title.value=formData.title||'';description.value=formData.description||'';collectEmail.checked=!!formData.settings?.collectEmail;showProgress.checked=formData.settings?.showProgress!==false;shuffle.checked=!!formData.settings?.shuffleQuestions;confirmation.value=formData.settings?.confirmationMessage||'Terima kasih atas respons Anda.';questions=formData.questions||[];shareUrl.value=new URL('../form/index.html?id='+id,location.href).href;setPublishUI();render()}
function render(){qEl.innerHTML='';questions.forEach((q,i)=>{const el=document.createElement('article');el.className='question card';el.innerHTML=`<div class="q-head"><span class="q-number">Q${i+1}</span><select class="q-type">${types.map(t=>`<option value="${t[0]}" ${q.type===t[0]?'selected':''}>${t[1]}</option>`).join('')}</select><label class="req"><input type="checkbox" ${q.required?'checked':''}> Required</label></div><input class="q-title" value="${esc(q.title||'')}" placeholder="Question"><div class="q-extra"></div><div class="q-actions"><button class="btn up" title="Move up">↑</button><button class="btn down" title="Move down">↓</button><button class="btn duplicate">DUPLICATE</button><button class="btn danger remove">DELETE</button></div>`;renderExtra(el.querySelector('.q-extra'),q);el.querySelector('.q-type').onchange=e=>{q.type=e.target.value;render();dirty()};el.querySelector('.q-title').oninput=e=>{q.title=e.target.value;dirty()};el.querySelector('.req input').onchange=e=>{q.required=e.target.checked;dirty()};el.querySelector('.up').onclick=()=>move(i,-1);el.querySelector('.down').onclick=()=>move(i,1);el.querySelector('.remove').onclick=()=>{questions.splice(i,1);render();dirty()};el.querySelector('.duplicate').onclick=()=>{questions.splice(i+1,0,structuredClone(q));render();dirty()};qEl.appendChild(el)})}
function renderExtra(el,q){if(['single','multi','dropdown'].includes(q.type)){q.options=q.options?.length?q.options:['Option 1','Option 2'];el.innerHTML=`<div class="options">${q.options.map(o=>`<div><input value="${esc(o)}"><button class="btn del-opt">×</button></div>`).join('')}<button class="btn add-opt">+ ADD OPTION</button></div>`;el.querySelectorAll('.options>div').forEach((row,j)=>row.querySelector('input').oninput=e=>{q.options[j]=e.target.value;dirty()});el.querySelectorAll('.del-opt').forEach((b,j)=>b.onclick=()=>{if(q.options.length>1)q.options.splice(j,1);render();dirty()});el.querySelector('.add-opt').onclick=()=>{q.options.push('New option');render();dirty()}}else if(q.type==='scale'){q.min=Number.isFinite(q.min)?q.min:1;q.max=Number.isFinite(q.max)?q.max:5;el.innerHTML=`<div class="scale-row"><label>Minimum<input class="min" type="number" min="0" max="9" value="${q.min}"></label><label>Maximum<input class="max" type="number" min="1" max="10" value="${q.max}"></label></div>`;el.querySelector('.min').oninput=e=>{q.min=Math.max(0,+e.target.value);dirty()};el.querySelector('.max').oninput=e=>{q.max=Math.min(10,+e.target.value);dirty()}}else el.innerHTML=`<div class="answer-preview">${q.type==='paragraph'?'Long text response':q.type==='date'?'Date picker':q.type==='time'?'Time picker':q.type==='number'?'Numeric response':q.type==='email'?'name@example.com':'Short text response'}</div>`}
function move(i,d){const n=i+d;if(n<0||n>=questions.length)return;[questions[i],questions[n]]=[questions[n],questions[i]];render();dirty()}
document.querySelector('.add-question').onclick=()=>{questions.push({type:'short',title:'Untitled question',required:false});render();dirty();setTimeout(()=>window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'}),30)};[title,description,collectEmail,showProgress,shuffle,confirmation].forEach(x=>x.addEventListener('input',dirty));function dirty(){saveState.innerHTML='<i class="save-dot saving"></i>Unsaved';clearTimeout(saveTimer);saveTimer=setTimeout(()=>save(),700)}async function save(published){clearTimeout(saveTimer);saveState.innerHTML='<i class="save-dot saving"></i>Saving';const payload={title:title.value.trim()||'Untitled PCP Form',description:description.value.trim(),questions,settings:{collectEmail:collectEmail.checked,showProgress:showProgress.checked,shuffleQuestions:shuffle.checked,confirmationMessage:confirmation.value.trim()||'Terima kasih atas respons Anda.'},updatedAt:serverTimestamp()};if(typeof published==='boolean')payload.published=published;await updateDoc(doc(db,'forms',id),payload);if(typeof published==='boolean')formData.published=published;saveState.innerHTML='<i class="save-dot"></i>Saved';setPublishUI()}
function setPublishUI(){publish.textContent=formData.published?'PUBLISHED':'PUBLISH';publish.disabled=!!formData.published;unpublish.classList.toggle('hidden',!formData.published)}publish.onclick=async()=>{if(!questions.length&&!confirm('Publish a form without questions?'))return;await save(true);toast('Form published')};unpublish.onclick=async()=>{await save(false);toast('Form unpublished')};preview.onclick=async()=>{await save();window.open('../form/index.html?id='+id+'&preview=1','_blank')};back.onclick=async()=>{await save();location.href='./dashboard.html'};copyUrl.onclick=async()=>{await navigator.clipboard.writeText(shareUrl.value);toast('Public link copied')};window.addEventListener('beforeunload',()=>clearTimeout(saveTimer));</script></body></html>
