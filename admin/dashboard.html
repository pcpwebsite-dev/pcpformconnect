<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PCP Forms — Dashboard</title><link rel="stylesheet" href="../css/common.css"><link rel="stylesheet" href="../css/admin.css"></head>
<body>
<div class="bg"></div>
<header class="topbar"><div class="bar"><a class="brand" href="#"><img src="../asset/logo/txt.png"><div class="copy"><b>PERSONA</b><b>COMMUNITY</b><b>PLAYER</b></div></a><nav class="nav"><a class="active" href="./dashboard.html">FORMS</a><a href="./responses.html">RESPONSES</a></nav><div class="actions"><button class="btn icon-btn" id="theme">◐</button><button class="btn" id="logout">SIGN OUT</button></div></div></header>
<main class="container page">
<section class="dash-head"><div><span class="badge">FIRESTORE / ADMIN</span><h1>Form <span>Workspace</span></h1><p class="muted">Buat, kelola, publish, preview, dan monitor seluruh form PCP.</p></div><button class="btn primary" id="newForm">+ NEW FORM</button></section>
<section class="stats"><div class="card stat"><small>TOTAL FORMS</small><b id="formCount">0</b></div><div class="card stat"><small>PUBLISHED</small><b id="publishedCount">0</b></div><div class="card stat"><small>RESPONSES</small><b id="responseCount">0</b></div></section>
<section id="forms" class="forms-grid"></section>
</main>
<script type="module">
import {auth,db,onAuthStateChanged,signOut,collection,getDocs,addDoc,serverTimestamp,getCountFromServer,doc,deleteDoc} from "../js/firebase.js";
const formsEl=document.querySelector("#forms");
let user;
onAuthStateChanged(auth,u=>{if(!u)location.href="./index.html";else{user=u;load()}});
logout.onclick=()=>signOut(auth);
theme.onclick=()=>document.body.classList.toggle("light");
newForm.onclick=async()=>{const ref=await addDoc(collection(db,"forms"),{title:"Untitled PCP Form",description:"",published:false,createdBy:user.uid,createdAt:serverTimestamp(),updatedAt:serverTimestamp(),settings:{collectEmail:false,showProgress:false,confirmationMessage:"Terima kasih atas respons Anda.",shuffleQuestions:false}});location.href="./builder.html?id="+ref.id};
async function load(){
 const snap=await getDocs(collection(db,"forms")); formsEl.innerHTML="";let pub=0,res=0;
 for(const d of snap.docs){const f=d.data();if(f.published)pub++;let count=0;try{count=(await getCountFromServer(collection(db,"forms",d.id,"responses"))).data().count}catch(e){}res+=count;
 const card=document.createElement("article");card.className="form-card card";card.innerHTML=`<div class="form-card-top"><span class="badge ${f.published?"published":"draft"}">${f.published?"PUBLISHED":"DRAFT"}</span><button class="dots">•••</button></div><h3>${esc(f.title||"Untitled")}</h3><p>${esc(f.description||"No description")}</p><div class="form-meta"><span>${count} response${count!==1?"s":""}</span><span>${f.updatedAt?.toDate?f.updatedAt.toDate().toLocaleDateString("id-ID"):"—"}</span></div><div class="form-actions"><button class="btn edit">EDIT</button>${f.published?`<button class="btn open">OPEN</button>`:""}<button class="btn danger delete">DELETE</button></div>`;
 card.querySelector(".edit").onclick=()=>location.href="./builder.html?id="+d.id;
 if(card.querySelector(".open"))card.querySelector(".open").onclick=()=>window.open("../form/index.html?id="+d.id,"_blank");
 card.querySelector(".delete").onclick=async()=>{if(confirm("Hapus form ini beserta dokumen form?")){await deleteDoc(doc(db,"forms",d.id));load()}};
 formsEl.appendChild(card)}
 formCount.textContent=snap.size;publishedCount.textContent=pub;responseCount.textContent=res;
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
</script>
</body></html>
