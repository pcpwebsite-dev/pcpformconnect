<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PCP Forms — Responses</title><link rel="stylesheet" href="../css/common.css"><link rel="stylesheet" href="../css/admin.css"></head><body><div class="bg"></div><header class="topbar"><div class="bar"><a class="brand" href="./dashboard.html"><img src="../asset/logo/txt.png"><div class="copy"><b>PERSONA</b><b>COMMUNITY</b><b>PLAYER</b></div></a><nav class="nav"><a href="./dashboard.html">FORMS</a><a class="active" href="./responses.html">RESPONSES</a></nav><div class="actions"><button class="btn icon-btn" id="theme">◐</button><button class="btn" id="logout">SIGN OUT</button></div></div></header><main class="container page"><section class="dash-head"><div><span class="badge">DATA / RESPONSES</span><h1>Response <span>Explorer.</span></h1><p class="muted">Inspect submissions and export clean CSV data.</p></div><select id="formSelect" style="max-width:320px"><option value="">Select form…</option></select></section><div id="tableWrap" class="card table-wrap"><div class="empty">Select a form to inspect responses.</div></div></main>
<script type="module">import{auth,db,onAuthStateChanged,signOut,collection,getDocs,doc,getDoc}from'../js/firebase.js';import{initTheme,esc,fmtDate,toast}from'../js/ui.js';initTheme();let currentForm,currentSnap;onAuthStateChanged(auth,u=>{if(!u)location.href='./index.html';else loadForms()});logout.onclick=()=>signOut(auth);async function loadForms(){const s=await getDocs(collection(db,'forms'));s.docs.sort((a,b)=>(a.data().title||'').localeCompare(b.data().title||'')).forEach(d=>{const o=document.createElement('option');o.value=d.id;o.textContent=d.data().title||d.id;formSelect.appendChild(o)})}formSelect.onchange=loadResponses;async function loadResponses(){const id=formSelect.value;if(!id)return;tableWrap.innerHTML='<div class="empty">Loading responses…</div>';const fs=await getDoc(doc(db,'forms',id));currentForm=fs.data();currentSnap=await getDocs(collection(db,'forms',id,'responses'));const docs=currentSnap.docs.sort((a,b)=>(b.data().submittedAt?.seconds||0)-(a.data().submittedAt?.seconds||0));if(!docs.length){tableWrap.innerHTML='<div class="empty">No responses yet.</div>';return}const qs=currentForm.questions||[];const rows=docs.map(d=>{const r=d.data();return`<tr><td>${fmtDate(r.submittedAt)}</td>${currentForm.settings?.collectEmail?`<td>${esc(r.email||r.answers?.__email||'')}</td>`:''}${qs.map((q,i)=>`<td>${esc(value(r.answers?.['q'+i]))}</td>`).join('')}</tr>`}).join('');tableWrap.innerHTML=`<div class="response-tools"><span class="badge">${docs.length} SUBMISSIONS</span><button class="btn primary" id="exportBtn">EXPORT CSV</button></div><div class="table-scroll"><table><thead><tr><th>Submitted</th>${currentForm.settings?.collectEmail?'<th>Email</th>':''}${qs.map(q=>`<th>${esc(q.title)}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`;exportBtn.onclick=csv}function value(v){return Array.isArray(v)?v.join(', '):v??''}function csv(){const qs=currentForm.questions||[],heads=['Submitted',...(currentForm.settings?.collectEmail?['Email']:[]),...qs.map(q=>q.title)];const lines=[heads.map(cell).join(',')];currentSnap.forEach(d=>{const r=d.data();lines.push([r.submittedAt?.toDate?.().toISOString()||'',...(currentForm.settings?.collectEmail?[r.email||r.answers?.__email||'']:[]),...qs.map((q,i)=>value(r.answers?.['q'+i]))].map(cell).join(','))});const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}));a.download=`${(currentForm.title||'pcp-form').replace(/[^a-z0-9]+/gi,'-').toLowerCase()}-responses.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('CSV exported')}function cell(x){return`"${String(x??'').replaceAll('"','""')}"`}</script></body></html>
