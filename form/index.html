<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PCP Form</title><link rel="stylesheet" href="../css/common.css"><link rel="stylesheet" href="../css/form.css"></head><body><div class="bg"></div><header class="topbar"><div class="container bar"><a class="brand" href="../"><img src="../asset/logo/txt.png"><div class="copy"><b>PERSONA</b><b>COMMUNITY</b><b>PLAYER</b></div></a></div></header><main class="public-wrap"><div id="progress" class="progress-wrap hidden"><div class="progress-track"><div id="progressBar" class="progress-bar"></div></div></div><section id="formView"><div class="card empty">Loading form…</div></section><section id="success" class="success-card card hidden"><div class="success-icon">✓</div><h1>Response <span>recorded.</span></h1><p id="successMessage" class="muted"></p><button class="btn primary" onclick="location.reload()">SUBMIT ANOTHER RESPONSE</button></section></main>
<script type="module">import{auth,db,doc,getDoc,collection,addDoc,serverTimestamp,onAuthStateChanged}from'../js/firebase.js';import{esc}from'../js/ui.js';const p=new URLSearchParams(location.search),id=p.get('id'),preview=p.get('preview')==='1';let formData,siteConfig={releaseStatus:'live',submissionsEnabled:true};const root=document.querySelector('#formView');load();async function load(){if(!id){unavailable('Form ID is missing.');return}const cs=await getDoc(doc(db,'app_config','site'));if(cs.exists())siteConfig=cs.data();const adminPreview=preview?await new Promise(r=>onAuthStateChanged(auth,x=>r(!!x))):false;if(siteConfig.releaseStatus!=='live'&&!adminPreview){const maint=siteConfig.releaseStatus==='maintenance';unavailable(maint?(siteConfig.maintenanceTitle||'We’ll be right back.')+' '+(siteConfig.maintenanceMessage||'PCP Forms is temporarily under maintenance.')+(siteConfig.maintenanceEta?' '+siteConfig.maintenanceEta:''):'PCP Forms has not been released publicly yet.');return}const s=await getDoc(doc(db,'forms',id));if(!s.exists()){unavailable('This form does not exist.');return}formData=s.data();if(!formData.published){if(preview){const u=adminPreview;if(!u){unavailable('This draft preview requires admin sign-in.');return}}else{unavailable('This form is not accepting responses.');return}}render()}function unavailable(msg){root.innerHTML=`<div class="card empty"><h2>Form unavailable</h2><p>${esc(msg)}</p></div>`}function render(){let qs=[...(formData.questions||[])];if(formData.settings?.shuffleQuestions)qs=qs.map((q,i)=>({...q,__original:i})).sort(()=>Math.random()-.5);else qs=qs.map((q,i)=>({...q,__original:i}));root.innerHTML=`${siteConfig.bannerEnabled&&siteConfig.bannerText?`<div class="site-banner">${esc(siteConfig.bannerText)}</div>`:''}<section class="public-header card"><span class="badge ${formData.published?'published':'draft'}">${formData.published?'● LIVE FORM':'DRAFT PREVIEW'}</span><h1>${esc(formData.title||'Untitled form')}</h1><p>${esc(formData.description||'')}</p></section><form id="response" class="public-form">${formData.settings?.collectEmail?`<div class="question card"><label>Email address <b>*</b></label><input name="__email" type="email" required autocomplete="email" placeholder="name@example.com"></div>`:''}${qs.map((q,n)=>question(q,n)).join('')}<button class="btn primary submit" type="submit">SUBMIT RESPONSE</button><p class="privacy">Responses are securely submitted to PCP Forms.</p></form>`;const f=document.querySelector('#response');if(siteConfig.submissionsEnabled===false&&!adminPreview){const b=f.querySelector('.submit');b.disabled=true;b.textContent='RESPONSES PAUSED';const note=document.createElement('div');note.className='submission-closed';note.textContent=siteConfig.closedMessage||'Responses are temporarily paused by the administrator.';b.before(note)}else f.onsubmit=submit;if(formData.settings?.showProgress){progress.classList.remove('hidden');const update=()=>{const controls=[...f.querySelectorAll('input,textarea,select')].filter(x=>!['radio','checkbox'].includes(x.type));const groups=[...new Set([...f.querySelectorAll('input[type=radio],input[type=checkbox]')].map(x=>x.name))];let done=controls.filter(x=>x.value).length+groups.filter(n=>f.querySelector(`[name="${n}"]:checked`)).length,total=controls.length+groups.length;progressBar.style.width=(total?done/total*100:0)+'%'};f.addEventListener('input',update);update()}}function question(q,n){const key='q'+q.__original,req=q.required?'required':'';let input='';if(q.type==='short')input=`<input name="${key}" ${req} placeholder="Your answer">`;else if(q.type==='paragraph')input=`<textarea name="${key}" ${req} placeholder="Your answer"></textarea>`;else if(q.type==='email')input=`<input name="${key}" type="email" ${req} placeholder="name@example.com">`;else if(q.type==='number')input=`<input name="${key}" type="number" ${req}>`;else if(q.type==='date')input=`<input name="${key}" type="date" ${req}>`;else if(q.type==='time')input=`<input name="${key}" type="time" ${req}>`;else if(q.type==='single')input=(q.options||[]).map(o=>`<label class="choice"><input type="radio" name="${key}" value="${esc(o)}" ${req}><span>${esc(o)}</span></label>`).join('');else if(q.type==='multi')input=(q.options||[]).map(o=>`<label class="choice"><input type="checkbox" name="${key}" value="${esc(o)}"><span>${esc(o)}</span></label>`).join('');else if(q.type==='dropdown')input=`<select name="${key}" ${req}><option value="">Choose an option…</option>${(q.options||[]).map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join('')}</select>`;else if(q.type==='scale'){const min=Math.max(0,q.min??1),max=Math.min(10,q.max??5);input=`<div class="scale">${Array.from({length:Math.max(0,max-min+1)},(_,i)=>min+i).map(v=>`<label><input type="radio" name="${key}" value="${v}" ${req}><span>${v}</span></label>`).join('')}</div>`}return`<div class="question card"><label>${n+1}. ${esc(q.title||'Untitled question')} ${q.required?'<b>*</b>':''}</label>${input}</div>`}async function submit(e){e.preventDefault();const btn=e.submitter;btn.disabled=true;btn.textContent='SUBMITTING…';const fd=new FormData(e.target),answers={};for(const[k,v]of fd.entries())if(k.startsWith('q'))answers[k]=answers[k]===undefined?v:Array.isArray(answers[k])?[...answers[k],v]:[answers[k],v];const payload={answers,submittedAt:serverTimestamp(),userAgent:navigator.userAgent.slice(0,1000),formVersion:formData.updatedAt||null};if(formData.settings?.collectEmail)payload.email=String(fd.get('__email')||'').slice(0,320);try{await addDoc(collection(db,'forms',id,'responses'),payload);root.classList.add('hidden');progress.classList.add('hidden');success.classList.remove('hidden');successMessage.textContent=formData.settings?.confirmationMessage||'Terima kasih atas respons Anda.';scrollTo({top:0,behavior:'smooth'})}catch(err){console.error(err);btn.disabled=false;btn.textContent='SUBMIT RESPONSE';alert('Response could not be submitted. Please try again.')}}</script></body></htm
